[pytest]
; Pytest configuration for the Gold Creation backend test suite.
; Note: in INI format a trailing "; text" is NOT a comment - it becomes part of the
; value. Every explanation below therefore sits on its own line above its key.

; Only collect tests from the backend/tests/ directory, so the ad-hoc
; backend/test_orders_route.py script at the package root is not auto-run.
testpaths = tests

; Collect files named test_*.py (test_models.py, test_routes.py, ...).
python_files = test_*.py

; Only run classes whose names start with Test (e.g. TestUser).
python_classes = Test*

; Only run functions whose names start with test_ (e.g. test_create_user).
python_functions = test_*

; Verbose output: print each test name as it runs.
addopts = -v

; Put the backend/ directory itself on sys.path so the tests can do
; `from app import ...` / `from app.models import ...` regardless of the
; working directory pytest was launched from.
pythonpath = .
