# nginx.conf - Reverse proxy in front of Gunicorn (port 5000).
# Serves static assets directly for performance and forwards all other requests to the app server.
upstream app_server {
    server 127.0.0.1:5000;
}

server {
    listen 80;
    server_name _;

    # Allow uploads up to 50MB (product images/videos).
    client_max_body_size 50M;

    access_log /var/log/nginx/gold_creation_access.log;
    error_log /var/log/nginx/gold_creation_error.log;

    # Default location: proxy everything to Gunicorn, forwarding real host/IP headers.
    location / {
        proxy_pass http://app_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Serve CSS/JS/images from the frontend build directly off disk with long cache expiry.
    location /static/ {
        alias /app/frontend/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Serve uploaded media (product photos/videos) with a shorter cache window.
    location /media/ {
        alias /app/frontend/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Health check endpoint used by Docker / load balancers; bypass access logging.
    location /health {
        proxy_pass http://app_server/health;
        access_log off;
    }
}