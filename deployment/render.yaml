services:
  - type: web
    name: gold-creation
    runtime: python
    region: oregon
    plan: starter
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && gunicorn --bind 0.0.0.0:$PORT --config gunicorn.conf.py run:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        # Set this as a Render secret or environment variable.
        # Example: mysql+pymysql://user:pass@host:3306/railway
        value: ${DB_URL}
      - key: ADMIN_EMAIL
        value: admin@goldcreation.com
      - key: ADMIN_PASSWORD
        generateValue: true
